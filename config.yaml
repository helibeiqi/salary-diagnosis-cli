# =============================================================================
# config.yaml — comp-agent-harness 全局配置
# =============================================================================
# 设计原则
# -----------------------------------------------------------------------------
# 1. **默认本地、默认安全**。薪资数据极度敏感，任何"方便"的默认值都不得
#    以牺牲数据安全为代价。默认 provider 是本机 Ollama，默认**不回退上云**。
# 2. **一处改，全链路生效**。模型、路径、安全开关、业务默认值全部集中在此，
#    切换部署形态（演示云端 / 生产本地）**不需要改任何一行代码**。
# 3. **注释即文档**。每个键都写清"是什么、业务含义、为什么是这个默认值"，
#    面试时可指着这个文件讲数据安全设计。
#
# 相关文档：docs/PRD.md（FR-12）、docs/ARCHITECTURE.md（§5.6）
# =============================================================================

# -----------------------------------------------------------------------------
# 一、运行路径（Windows 纪律：一律用 C:/ 正斜杠，不要 /c/...）
# -----------------------------------------------------------------------------
paths:
  # Python 解释器。必须是这个 anaconda 解释器 —— pandas/numpy/openpyxl/plotly
  # 只装在它里面。写成 /c/ProgramData/... 会被 Git Bash 改写成 C:\c\... 而失败。
  python_exe: "C:/ProgramData/anaconda3/python.exe"

  # 项目根目录。Python worker 的 cwd，也是所有相对产出路径的基准。
  # 留空或为 "." 时，以「启动进程的工作目录」为根（仓库根目录即可），
  # 不要写死个人绝对路径——避免泄露本机布局，也保证仓库可移植。
  project_root: "."

  # Python worker 入口脚本（插件层通过持久 stdio NDJSON 与之通信）
  worker_script: "src/tools/server.py"

  data_dir: "data"        # 输入数据目录（同时是云端模式的数据白名单）
  report_dir: "report"    # 报告产物目录
  assets_dir: "assets"    # 图表 HTML/PNG 与明细 CSV
  state_dir: ".state"     # 会话缓存（.gitignore，永不进仓库）

# -----------------------------------------------------------------------------
# 二、模型层（配置化切换 —— 需求 §4.1 / PRD FR-12）
# -----------------------------------------------------------------------------
models:
  # 默认提供方。
  #   ollama-local  —— 本机 Ollama（**默认**）
  #   vllm-local    —— 本机 vLLM（OpenAI 兼容接口）
  #   deepseek-cloud—— DeepSeek 云端 API
  # 为什么默认本地：真实薪资一旦发往云端 API，就在厂商日志里留了底，
  # 这对企业是不可接受的风险。默认本地 = 默认不泄露。
  default_provider: "ollama-local"

  # --- 提供方清单 -----------------------------------------------------------
  providers:
    ollama-local:
      label: "本地 Ollama"
      # 本地服务，不需要 API Key；api_key_env 留空表示不读取任何密钥
      base_url: "http://localhost:11434/v1"
      model: "deepseek-r1:14b"
      api_key_env: ""            # 本地部署无密钥
      timeout_s: 120
      local: true                # ★ 本地标记：数据安全闸门据此放行真实数据
      note: "面试/生产推荐。需先 ollama pull deepseek-r1:14b。"

    vllm-local:
      label: "本地 vLLM"
      base_url: "http://localhost:8000/v1"
      model: "deepseek-ai/DeepSeek-V3"
      api_key_env: "VLLM_API_KEY"
      timeout_s: 180
      local: true
      note: "OpenAI 兼容接口，适合有 GPU 的机器部署 deepseek-r1 / DeepSeek-V3。"

    deepseek-cloud:
      label: "DeepSeek 云端 API"
      base_url: "https://api.deepseek.com"
      model: "deepseek-chat"
      api_key_env: "DEEPSEEK_API_KEY"   # 从环境变量读取，密钥绝不写进配置文件
      timeout_s: 60
      local: false               # ★ 非本地：触发数据安全闸门
      note: "仅限模拟数据演示。处理真实薪资请勿使用（见 security 段）。"

  # --- 采样参数 -------------------------------------------------------------
  # 薪酬分析要的是确定性复现，不要用高 temperature。
  sampling:
    temperature: 0.2
    top_p: 0.9
    max_tokens: 4096

  # --- 回退策略（★ 关键安全设计）-------------------------------------------
  fallback:
    # 本地模型不可用（未启动 / 连接失败）时，**绝不自动切到云端**。
    # 理由：自动回退会让用户在毫无察觉的情况下把真实薪资发上云，
    # 这是本项目最不能犯的错。宁可报错让用户知道"本地模型没起来"。
    enabled: false

    # 只有在用户**显式确认**后才允许切到云端（例如命令行传 --allow-cloud，
    # 或在对话中明确答复"允许使用云端模型"）。每次会话只生效一次。
    require_explicit_confirm: true

    # 允许回退时的降级顺序（先试本地，再试本地，最后才是云端）
    chain: ["ollama-local", "vllm-local"]

    # --- Phase 3：数据分级感知熔断器（架构 §4.2 / ROADMAP Phase 3）------
    # 维护每 provider 失败计数 / 429 / 402 速率；跳闸后动作**按数据分级**：
    #   on_real      —— 真实数据：硬停 + 告警，**绝不**自动回退云端（守住红线）
    #   on_sanitized —— 脱敏/模拟：按上面 chain 降级到最便宜的安全 provider
    # 本 Python 侧是政策引擎的权威实现（circuit_breaker.py）；
    # 强制点在 TS service.ts 调用模型前咨询它（见设计文档 §9 / §4.2）。
    circuit_breaker:
      enabled: true
      failure_threshold: 5      # 窗口内连续失败达到该值即跳闸
      window_s: 60              # 失败计数滑动窗口（秒）
      half_open_after_s: 30     # 跳闸后多久进入半开探测（允许少量流量验证恢复）
      on_real: "hard_stop"      # 真实数据：跳闸→硬停+告警，绝不自动上云
      on_sanitized: "fallback"  # 脱敏/模拟：按 chain 降级到最便宜安全 provider

    # 本地模型不可用时的提示文案（原样展示给用户）
    local_unavailable_hint: >-
      本地模型（Ollama / vLLM）当前不可用。为保护薪资数据，系统不会自动切换到云端模型。
      请确认：① Ollama 是否已启动（ollama serve）；② 模型是否已拉取（ollama pull deepseek-r1:14b）。
      若确需使用云端模型处理**模拟数据**，请显式授权。

# -----------------------------------------------------------------------------
# 三、数据安全（PRD NFR-01 / NFR-02 —— 本项目的第一优先级）
# -----------------------------------------------------------------------------
security:
  # 是否允许把「非白名单目录」的数据发给云端模型。
  # false = 默认禁止。这是 DATA_SAFETY_BLOCKED 错误的触发条件。
  allow_cloud_with_real_data: false

  # 数据白名单：只有这些目录下的文件才被视为"模拟/演示数据"，
  # 允许在云端 provider 下使用。默认只放开 data/。
  whitelist_dirs:
    - "data/"

  # 是否把清洗后的 DataFrame 落盘到 .state/*.parquet（供 worker 重启后恢复）。
  # true  = 本地模式推荐，重启不用重新加载，演示体验好；
  # false = **接入云端 API 时必须设为 false** —— 薪资数值不落盘。
  persist_dataframe: true

  # 一旦 provider 非本地（local: false），是否强制把 persist_dataframe 置 false。
  # true 表示强制 —— 这是"云端模式下薪资不落盘"的自动执行，不依赖人记得改。
  force_no_persist_when_cloud: true

  # 加载时是否默认做脱敏（姓名→姓**、薪资比例缩放）。
  # 注意：这只是防呆，不等于匿名化。
  desensitize_on_load: true

  # 日志脱敏相关
  logging:
    level: "INFO"
    # 单条日志最大字符数（超出截断）。防止某处误把整张表打进日志。
    max_line_chars: 500
    # 日志中是否允许出现员工 ID 列表（false = 只允许出现计数，不允许枚举）
    allow_emp_id_enumeration: false
    # 日志中是否允许出现薪资数值（只允许汇总口径，不允许逐行）
    allow_row_level_salary: false

# -----------------------------------------------------------------------------
# 四、会话与 worker（PRD FR-15 / 架构 §5.2、§5.3）
# -----------------------------------------------------------------------------
runtime:
  session:
    default_id: "default"
    # 会话空闲多久后清理（秒）
    ttl_s: 3600

  worker:
    # 启动就绪等待上限（首次 import pandas 约 2-3s）
    ready_timeout_s: 30
    # 单请求超时（重的如 generate_report 可到 120s）
    request_timeout_s: 30
    # 心跳间隔 / 连续几次无响应判定死亡
    heartbeat_interval_s: 60
    heartbeat_miss_limit: 2
    # 30 秒内重启超过 3 次则放弃重启，向上抛 INTERNAL_ERROR（防死循环）
    max_restart_per_30s: 3
    env:
      PYTHONIOENCODING: "utf-8"      # 否则中文输出乱码
      PYTHONUNBUFFERED: "1"          # NDJSON 必须无缓冲，否则分帧粘包

# -----------------------------------------------------------------------------
# 五、PTC 沙箱（run_comp_code —— PRD FR-13 / 架构 §5.4）
# -----------------------------------------------------------------------------
sandbox:
  timeout_s: 15
  max_code_chars: 8000
  max_stdout_bytes: 8192
  max_result_bytes: 65536
  # 允许 import 的模块白名单（AST 静态预检 + __import__ 拦截，双层）
  allowed_modules:
    - "pandas"
    - "numpy"
    - "math"
    - "statistics"
    - "json"
    - "decimal"
    - "itertools"
    - "collections"
  # 威胁模型（如实写进 README）：这是**防呆层，不是对抗恶意代码的安全边界**，
  # 目标是防止模型误写危险代码，与官方对 worker-thread 的表述保持一致。
  isolated: "subprocess"     # 一次性子进程；每次运行全新状态

  # --- Phase 2：常驻沙箱 + 配额（架构 §4.4 / ROADMAP Phase 2）-------------
  # resident：复用解释器，避免每次冷启一次性 subprocess（2–3s + 重 import pandas）。
  #   常驻 worker 懒启动、进程死亡自动重启、失败自动回退一次性 subprocess（安全兜底）。
  #   设为 false 可完全回到旧的一次性 subprocess 行为（便于 A/B 与回滚）。
  resident: true
  # 全局并发上限：单 worker 进程内同时最多 K 个沙箱执行（线程信号量）。
  max_concurrent: 2
  # 每会话调用配额：滑动窗口内最多 M 次沙箱调用，杜绝失控循环耗尽本机资源。
  quota:
    max_calls: 50
    window_s: 60

# -----------------------------------------------------------------------------
# 六、图表与报告（PRD FR-14 / 架构 §5.5）
# -----------------------------------------------------------------------------
charts:
  # 中文字体。plotly 默认字体无中文字形，中文标题会变方框 —— 必须单点统一设置。
  font_family: "'Microsoft YaHei','SimHei','Noto Sans CJK SC',sans-serif"
  font_size: 12

  # plotly.js 引入方式：
  #   inline —— 内联进 HTML（默认）。离线可用；单文件约 3MB。
  #   cdn    —— 引 CDN。文件小，但断网即失效，且与"不出内网"自相矛盾。
  plotlyjs_mode: "inline"

  # 静态图：运行时探测 kaleido，有则出 PNG，无则优雅降级为 HTML（绝不报错）。
  try_png: true

  width: 1000
  height: 560

report:
  default_formats: ["md", "html"]    # 双格式：md 可 diff，html 可双击即开
  include_appendix: true             # 附方法论与口径说明（口径可被外部审计）
  title_prefix: "薪酬诊断报告"
  # 数据安全声明（每份报告强制注入，不得删改）
  data_source_declaration: >-
    本报告全部数据来自本地模拟数据（data/ 目录），未上传任何云端服务。
    处理真实薪资请使用本地模型部署，切勿上传至云端 API。

# -----------------------------------------------------------------------------
# 七、业务默认值（口径兜底 —— 与 schemas.py 保持一致，不要在这里改口径）
# -----------------------------------------------------------------------------
business:
  # 红绿圈阈值。改这里会改变全链路判定，需同步改 schemas.py 的
  # RED_CIRCLE_CR / GREEN_CIRCLE_CR（以 schemas.py 为单一真理源）。
  red_cr: 1.20
  green_cr: 0.80

  # 带宽设计默认值
  band:
    midpoint_diff: 0.15        # 中位值级差（相邻职级中位值增幅）
    spread_mode: "tier_default"  # tier_default | uniform | explicit
    use_market: true           # 有市场数据时中位值是否锚定市场分位值
    market_percentile: "P50"
    round_to: null             # 展示取整粒度（null=不取整）
    # ★ 判定与 CR 计算一律用未取整值；取整只作用于对外发布的带宽表（PRD K9）

  # 调薪模拟默认值
  increase:
    default_budget_pct: 0.05   # 默认调薪预算占薪资基数 5%
    strategies: ["A", "B", "C", "D"]
    cap_pct: 0.20              # 个人单次涨幅上限
    green_target: "band_min"   # 策略 B 补底目标
    frozen_for_red: true       # 策略 D 红圈是否完全冻结且不占调薪池
    # ★ 带宽是否随调薪同步上移（PRD K7 / AC-24、AC-24b）
    #   false = 主口径（带宽冻结，暴露真实成本）
    #   true  = 对照口径（带宽年度重定级后的稳态）
    # 报告必须**并列展示两种情景**，不得只给其一。
    rebase_band: false
    report_both_scenarios: true

  # 固浮比：业绩达成率扫描区间
  paymix:
    achievement_min: 0.0
    achievement_max: 1.5
    achievement_step: 0.05
    # 当前口径：上封顶 150%、下不保底（固定值，未参数化）
    cap_achievement: 1.5

  # 市场对标默认分位策略
  market:
    default_strategy: "auto"   # auto = 按 schemas.DEFAULT_MARKET_STRATEGY 取
    by_family:                 # auto 时的取值（与 schemas.py 保持一致）
      销售: "P75"
      技术: "P75"
      管理: "P50"
      操作: "P25"
      职能: "P50"

  # 岗位评估
  jobeval:
    default_model: "hay"       # hay | mercer
    # ★ 1-10 加权分 → 百分制总分的换算系数（PRD K8）
    #   必须以 schemas.JOB_SCORE_SCALE 为唯一来源，此处仅作说明，不要改。
    score_scale: 160.0
    missing_subfactor_fill: "factor_mean"   # factor_mean | fixed_5

# -----------------------------------------------------------------------------
# 七·五、遥测总线（Phase 0 — 自主优化架构师）
# -----------------------------------------------------------------------------
# 零 PII 的本地调用账本：每次 tools/call 追加一条
# {tool, ok, code, elapsed_ms, session_classification} 到 .state/telemetry.parquet。
# 唯一用途：让"每会话成本 / 每工具延迟 / 失败率"可见，从而能优化与自愈。
# 纪律：telemetry 里绝不写任何行级薪资或员工 ID（复用 security.logging 的口径）。
# 关闭方式（独立模式零痕迹）：
#   ① 环境变量 COMP_TELEMETRY_OFF=1 —— 一键零痕迹（演示用，优先级最高）；
#   ② 下面 enabled: false —— 仓库级默认关闭。
# 两者都未禁用时默认开启（测量无害、零 PII）。
telemetry:
  enabled: true
  state_dir: ".state"            # 与 paths.state_dir 一致；落盘 telemetry.parquet（已 gitignore）
  flush_every: 20                # 内存缓冲达到该条数后落盘一次（降低高吞吐 worker 的 IO 抖动）

# -----------------------------------------------------------------------------
# 七·六、影子路由（Phase 4 — 自主优化架构师）
# -----------------------------------------------------------------------------
# 本段是「影子测试 + 模型路由」(架构 §4.3) 的**配置化开关**，与熔断器同款哲学：
# 模型侧的"自动路由到更便宜模型"只在脱敏/模拟数据上生效，真实数据路径永远 baseline。
#
# 运行期行为（src/tools/shadow_router.py）：
#   * 线上对 ambiguous 列同时跑 baseline 与 candidate，候选只评分不生效（Shadow Traffic）；
#   * 候选在 ≥ min_shadow_runs 次影子执行上满足
#       accuracy ≥ baseline − max_acc_drop_pct%
#       AND 成本降幅 ≥ min_cost_reduction_pct%
#       AND 延迟降幅 ≥ min_latency_reduction_pct%
#     → 自动晋升：mapping 子任务路由到 candidate；narration 子任务仍走 baseline；
#   * 候选准确率骤降 → 自动回滚到 baseline + 告警；
#   * classification == "real" 时，任何子任务都强制 baseline，绝不晋升/切候选（红线）。
# Python 侧是决策权威实现；强制点在 TS service.ts 调用模型前咨询它（见设计文档 §10 / §9.3）。
shadow_routing:
  enabled: true
  # baseline = 本地大模型（贵但准，作为对照基准）；candidate = 更小更快的本地模型（待晋升）
  baseline_provider: "deepseek-r1:14b"
  candidate_provider: "qwen2.5-7b"
  # 子任务路由策略：mapping 允许晋升到候选；narration 固定 baseline（需大模型语义）
  task_routing:
    mapping: "candidate"
    narration: "baseline"
  # 晋升门槛（架构 §4.3）
  promotion:
    min_shadow_runs: 1000          # 至少 1000 次影子执行才敢下结论
    max_acc_drop_pct: 2.0          # 候选准确率不得低于 baseline − 2%
    min_cost_reduction_pct: 50.0   # 候选成本须 ↓≥50%
    min_latency_reduction_pct: 40.0 # 候选延迟须 ↓≥40%
  # 初始权重（未晋升：mapping 全走 baseline）。晋升后由代码改写为 {baseline:0, candidate:1}
  weights:
    mapping: { baseline: 1.0, candidate: 0.0 }
  # 合成分数权重（score = 5·命中率 + 3·歧义召回 − w1·延迟(秒) − w2·成本(USD)）
  scoring:
    w1: 0.01
    w2: 0.0001
  # 仅这些分级允许参与晋升/路由（真实数据永远不在内）
  eligible_only_on: ["sanitized", "simulated"]
  # 落盘状态（晋升/权重/累计统计），.state/ 已 gitignore
  state_file: ".state/shadow_router.json"

# -----------------------------------------------------------------------------
# 八、离线与可复现（PRD NFR-06 / NFR-08）
# -----------------------------------------------------------------------------
reproducibility:
  # 造数随机种子。固定种子 ⇒ 每次演示产出完全一致（面试演示必备）。
  mock_seed: 20260830
  mock_default_rows: 150

  # 离线模式开关。true 时由基建层禁用 socket，任何网络访问直接抛错。
  # QA 验证"断网可跑"时用 main.py --offline 或直接断网。
  offline: false

  # 严格告警模式：把 FutureWarning / DeprecationWarning 升格为错误。
  # CI 与 QA 应设为 true（PRD NFR-09 / AC-38）。
  strict_warnings: false
